name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: diffcraft
          POSTGRES_PASSWORD: diffcraft
          POSTGRES_DB: diffcraft_test
        ports:
          - 5432:5432
        # Job steps wait until the health check passes.
        options: >-
          --health-cmd "pg_isready -U diffcraft -d diffcraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json (pnpm 12 needs >= v6.1.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The api project's Vitest global setup runs the migrations against TEST_DATABASE_URL first.
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://diffcraft:diffcraft@localhost:5432/diffcraft_test
          TEST_REDIS_URL: redis://localhost:6379/1

      # The production bundle (dist/server.js, dist/migrate.js) that Render runs.
      - name: Build API
        run: pnpm --filter @diffcraft/api build

      - name: Build web
        run: pnpm --filter @diffcraft/web build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: diffcraft
          POSTGRES_PASSWORD: diffcraft
          POSTGRES_DB: diffcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffcraft -d diffcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the verification emails the tests read.
      mailpit:
        image: axllent/mailpit:v1.27.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_SKIP_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub's Ubuntu runners ship Google Chrome; download Playwright's Chromium only if it's missing.
      - name: Use the runner's Chrome, or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            pnpm --filter @diffcraft/e2e exec playwright install --with-deps chromium
            echo "E2E_BROWSER_CHANNEL=" >> "$GITHUB_ENV"
          fi

      - name: Build API
        run: pnpm --filter @diffcraft/api build

      # The /api rewrite and the realtime URL are fixed at build time: built for the e2e ports.
      - name: Build web for e2e
        run: pnpm --filter @diffcraft/web build
        env:
          API_URL: http://localhost:4100
          NEXT_PUBLIC_REALTIME_URL: http://localhost:4100
          NEXT_DIST_DIR: .next-e2e

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
