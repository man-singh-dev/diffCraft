name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: diffcraft
          POSTGRES_PASSWORD: diffcraft
          POSTGRES_DB: diffcraft_test
        ports:
          - 5432:5432
        # Job steps wait until the health check passes.
        options: >-
          --health-cmd "pg_isready -U diffcraft -d diffcraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json (pnpm 12 needs >= v6.1.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The api project's Vitest global setup runs the migrations against TEST_DATABASE_URL first.
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://diffcraft:diffcraft@localhost:5432/diffcraft_test

      - name: Build web
        run: pnpm --filter @diffcraft/web build
